services:
  web:
    image: chatwoot-zzap-integration:latest
    env_file:
      - .env
    environment:
      APP_MODE: web
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    image: chatwoot-zzap-integration:latest
    env_file:
      - .env
    environment:
      APP_MODE: worker
    restart: unless-stopped
